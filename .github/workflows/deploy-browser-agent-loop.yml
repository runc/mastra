name: Deploy browser-agent-loop to Cloudflare Pages

on:
  push:
    branches:
      - feat/browser-agent-loop
      - main
    paths:
      - 'explorations/mastra-browser-loop/**'
      - '.github/workflows/deploy-browser-agent-loop.yml'
  workflow_dispatch:

concurrency:
  group: deploy-browser-agent-loop
  cancel-in-progress: true

jobs:
  deploy:
    if: github.repository == 'runc/mastra'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node
        with:
          install-dependencies: false

      - name: Install dependencies
        run: pnpm install --filter @explorations/mastra-browser-loop... --frozen-lockfile

      - name: Build
        run: pnpm --filter @explorations/mastra-browser-loop build

      - name: Create Pages project (if missing)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: pages project create browser-agent-loop --production-branch=feat/browser-agent-loop
        continue-on-error: true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: npm
          command: pages deploy explorations/mastra-browser-loop/dist --project-name=browser-agent-loop --branch=${{ github.ref_name }} --commit-dirty=true
